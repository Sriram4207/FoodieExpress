<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Foodie Express - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app.css">
</head>

<body>

<div class="auth-container">

<div class="auth-left">

    <h1>Foodie Express</h1>

    <p>
        Order your favorite meals anytime, anywhere.
        Fast delivery from the best restaurants near you.
    </p>

</div>

<div class="auth-right">

    <form class="auth-form"
          action="loginservlet"
          method="post">

        <h2>Welcome Back 👋</h2>

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

        <div class="auth-link">
            Don't have an account?
            <a href="signup.html">
                Create Account
            </a>
        </div>

    </form>

</div>

</div>

</body>
</html>
