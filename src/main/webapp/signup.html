<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Foodie Express - Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app.css">
</head>

<body>

<div class="auth-container">

<div class="auth-left">

    <h1>Foodie Express</h1>

    <p>
        Join Foodie Express today and enjoy food
        delivery from your favorite restaurants.
    </p>

</div>

<div class="auth-right">

    <form class="auth-form"
          action="signupservlet"
          method="post">

        <h2>Create Account</h2>

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <textarea
               name="address"
               placeholder="Address"
               rows="3"
               required></textarea>

        <select name="role">

            <option value="customer">
                Customer
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <button type="submit">
            Create Account
        </button>

        <div class="auth-link">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </div>

    </form>

</div>

</div>

</body>
</html>
